<link rel="icon" href="/assets/favicon/favicon-32.png" sizes="32x32" type="image/png">

<style>
  @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
    src:url('/assets/fonts/inter-latin-wght-normal.woff2') format('woff2-variations')}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;flex-direction:column;background:#FAF9F7;color:#14171A;
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:#14171A;text-decoration:none}
  a:hover{color:#5A5F64}

  /* Navigationsleiste, wie auf der Startseite. */
  :root{--nav-schub:translateY(0);--kopf-breite:auto;--nav-schatten:none;--nav-links:flex}
  [data-h="h0"]:hover{background:#FFFFFF !important;color:#14171A !important}
  .nur-breit-i{display:inline}
  .nur-schmal-i{display:none}
  .menue-knopf{display:none;flex:0 0 auto;flex-direction:column;justify-content:center;
    gap:5px;width:38px;height:38px;padding:0 7px;border:0;background:none;cursor:pointer}
  .menue-knopf span{display:block;height:2px;width:100%;background:#14171A;border-radius:2px;
    transition:transform .25s,opacity .2s}
  header[data-menue="auf"] .menue-knopf span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  header[data-menue="auf"] .menue-knopf span:nth-child(2){opacity:0}
  header[data-menue="auf"] .menue-knopf span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

  /* Zeile mit Thema und Herunterladen, direkt ueber dem Blatt. */
  .strich{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;
    justify-content:space-between;gap:10px 24px;
    padding:0 clamp(12px,2.5vw,32px) 12px}
  .strich-innen{width:100%;max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;
    align-items:center;justify-content:space-between;gap:10px 24px}
  .weg{display:flex;align-items:center;gap:8px;font-size:14px;color:#5A5F64;min-width:0}
  .weg strong{font-weight:600;color:#14171A}
  .laden{flex:0 0 auto;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:11px 18px;border-radius:999px;background:#123540;color:#FAF9F7;
    border:1px solid #14171A;white-space:nowrap}
  .laden:hover{background:#FFFFFF;color:#14171A}

  main{flex:1 1 auto;min-height:0;display:flex;
    padding:0 clamp(12px,2.5vw,32px) clamp(12px,2.5vw,32px)}
  .rahmen{width:100%;max-width:1400px;margin:0 auto;border:1px solid #E3E0DA;border-radius:14px;
    overflow:hidden;background:#FFFFFF;display:flex}
  object{flex:1 1 auto;width:100%;height:100%;border:0;display:block}
  .ersatz{margin:auto;padding:48px 24px;text-align:center;max-width:28rem;display:flex;
    flex-direction:column;gap:16px;align-items:center;font-size:15px;line-height:1.6;color:#3A3F44}

  a:focus-visible,button:focus-visible{outline:2px solid #123540;outline-offset:3px}
  @media (max-width:759px){
    .nur-breit-i{display:none}
    .nur-schmal-i{display:inline}
    header > div{flex-wrap:wrap;row-gap:0;gap:8px!important;
      padding-left:16px!important;padding-right:10px!important}
    header > div > a:first-child{font-size:15px!important;letter-spacing:-.01em!important}
    #nav-cta{padding:10px 13px!important;font-size:10px!important;letter-spacing:.06em!important}
    .menue-knopf{width:34px!important;padding:0 5px!important;display:flex!important}
    header nav{display:none!important}
    header[data-menue="auf"] nav{display:flex!important;order:3;flex:1 0 100%!important;
      flex-direction:column!important;align-items:flex-start!important;
      justify-content:flex-start!important;height:auto!important;overflow:visible!important;
      column-gap:0!important;row-gap:0;line-height:1.4!important;font-size:14px!important;
      margin-top:12px;padding-top:6px;border-top:1px solid #E3E0DA}
    header[data-menue="auf"] nav a{padding:12px 0;width:100%}
  }
  @media (max-width:359px){
    header > div{gap:6px!important;padding-left:12px!important;padding-right:8px!important}
    header > div > a:first-child{font-size:13px!important}
    #nav-cta{padding:10px 11px!important}
  }
</style>
</head>
<body>

<header style="position:fixed;top:0;left:0;right:0;width:var(--kopf-breite);box-sizing:border-box;z-index:50;padding:16px clamp(12px,2.5vw,32px);pointer-events:none;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform:var(--nav-schub)">
  <div style="pointer-events:auto;max-width:1400px;margin:0 auto;background:#FFFFFF;border:1px solid #E3E0DA;border-radius:14px;box-shadow:var(--nav-schatten);padding:12px clamp(14px,3vw,40px) 12px clamp(18px,3vw,40px);display:flex;align-items:center;justify-content:space-between;gap:clamp(12px,3vw,40px);transition:box-shadow .3s">
    <a href="/" style="flex:0 0 auto;font-family:'Inter',sans-serif;font-weight:500;font-size:clamp(17px,2vw,28px);letter-spacing:.005em;white-space:nowrap">PD Dr. Raphael R. Bruno</a>
    <nav id="menue" style="flex:1 1 0;min-width:0;display:var(--nav-links);flex-wrap:wrap;justify-content:flex-end;column-gap:clamp(18px,2.4vw,34px);height:20px;overflow:hidden;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;line-height:20px">
      <a href="/#podcast" style="white-space:nowrap">Podcast</a>
      <a href="/#buch" style="white-space:nowrap">Buch</a>
      <a href="/#ueber" style="white-space:nowrap">Über Dr. Bruno</a>
      <a href="https://www.instagram.com/doktorbruno/" target="_blank" rel="noopener" style="white-space:nowrap">Instagram ↗</a>
    </nav>
    <a href="/#kontakt" style="flex:0 0 auto;white-space:nowrap;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:13px 22px;border-radius:999px;background:#123540;color:#FAF9F7;border:1px solid #14171A" data-h="h0" id="nav-cta"><span class="nur-breit-i">Kontakt aufnehmen</span><span class="nur-schmal-i">Kontakt</span></a>
    <button type="button" id="menue-knopf" class="menue-knopf" aria-expanded="false" aria-controls="menue" aria-label="Menü öffnen"><span></span><span></span><span></span></button>
  </div>
</header>
<div style="flex:0 0 auto;height:clamp(84px,9vw,110px)"></div>

<div class="strich">
  <div class="strich-innen">
    <div class="weg"><a href="/handouts/">Handouts</a><span aria-hidden="true">·</span><strong>Cholesterin</strong></div>
    <a class="laden" href="cholesterin.pdf" download>Herunterladen</a>
  </div>
</div>

<main>
  <div class="rahmen">
    <object data="cholesterin.pdf" type="application/pdf">
      <div class="ersatz">
        <p style="margin:0">Ihr Browser kann das PDF nicht direkt anzeigen.</p>
        <a class="laden" href="cholesterin.pdf" download>Handout herunterladen</a>
      </div>
    </object>
  </div>
</main>

<script>
(function () {
  'use strict';
  var wurzel = document.documentElement, letztes = window.scrollY,
      versteckt = false, geschattet = false;
  function leisteAusrichten() {
    wurzel.style.setProperty('--kopf-breite', wurzel.clientWidth + 'px');
  }
  leisteAusrichten();
  window.addEventListener('resize', leisteAusrichten);
  window.addEventListener('load', leisteAusrichten);
  window.addEventListener('scroll', function () {
    var y = window.scrollY, dy = y - letztes;
    if (Math.abs(dy) < 6) return;
    var v = dy > 0 && y > 120, s = y > 20;
    if (v !== versteckt) {
      versteckt = v;
      wurzel.style.setProperty('--nav-schub', v ? 'translateY(-130%)' : 'translateY(0)');
    }
    if (s !== geschattet) {
      geschattet = s;
      wurzel.style.setProperty('--nav-schatten', s ? '0 8px 30px rgba(20,23,26,.08)' : 'none');
    }
    letztes = y;
  }, { passive: true });

  var kopf = document.querySelector('header'),
      menueKnopf = document.getElementById('menue-knopf'),
      menue = document.getElementById('menue');
  function menueZu() {
    kopf.removeAttribute('data-menue');
    menueKnopf.setAttribute('aria-expanded', 'false');
    menueKnopf.setAttribute('aria-label', 'Menü öffnen');
  }
  if (menueKnopf) {
    menueKnopf.addEventListener('click', function () {
      if (kopf.getAttribute('data-menue') === 'auf') { menueZu(); return; }
      kopf.setAttribute('data-menue', 'auf');
      menueKnopf.setAttribute('aria-expanded', 'true');
      menueKnopf.setAttribute('aria-label', 'Menü schließen');
    });
    menue.addEventListener('click', function (e) { if (e.target.closest('a')) menueZu(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') menueZu(); });
  }
})();
</script>
</body>
</html>
